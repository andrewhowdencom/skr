name: Lint Skills

on:
  push:
    branches: [ main ]
    paths:
      - 'skills/**'
      - 'cmd/**'
      - 'pkg/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'skills/**'
      - 'cmd/**'
      - 'pkg/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Build skr
        run: go build -o skr main.go

      - name: Lint all skills
        run: |
          # Find all directories containing SKILL.md
          find skills -name SKILL.md -exec dirname {} \; | while read dir; do
            echo "Linting $dir..."
            ./skr lint "$dir" --fail-on spec,style
          done
